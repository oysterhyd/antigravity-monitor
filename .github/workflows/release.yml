name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -tags=monitor_sqlite_cgo,mygo_nowebview
      CGO_CFLAGS: -Os -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DQS=0 -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_OMIT_PROGRESS_CALLBACK
      CGO_LDFLAGS: -static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tests
        run: |
          gcc --version
          go vet ./...
          go test ./...

      - name: Build Windows installer and signed update manifest
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -upload

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --title "Antigravity Monitor ${{ github.ref_name }}"
